<title id="title">DetectionForge high-level architecture</title>
<desc id="desc">Approved users access a React dashboard with Auth0 sign-in. Explicitly consented foreground agents send HTTPS telemetry to FastAPI on Render. Live staging uses Render PostgreSQL over verified TLS. Manual encrypted backups were restored to an isolated Aiven Free rehearsal destination; no live cutover has occurred.</desc>
